[project]
name = "benchhand-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.15",
  "mypy>=1.18",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "datamodel-code-generator==0.101.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
  "reference",
  "packages/benchhand-contracts/src/benchhand_contracts/models",
  "packages/benchhand-contracts/src/benchhand_contracts/schemas",
  "packages/benchhand-contracts/src/benchhand_contracts/examples",
]

[tool.ruff.lint]
# Greenfield: the complexity limits are enforced outright, i.e. a ratchet held at zero.
select = ["E", "F", "W", "I", "B", "UP", "C901", "PLR0912", "PLR0915", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
pythonpath = ["tools/gen"]
addopts = "-q"

[tool.pyright]
# tools/gen is imported by its tests through pytest's pythonpath, not installed.
extraPaths = ["tools/gen"]
