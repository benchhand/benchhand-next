# The prototype at 412b5d9: flow_profile_gate.py, as a restricted cel-policy
# rule list (flow/rules.schema.json). flow.yaml names it as the rigor list,
# so every output is a bool, true when the extra requirement holds:
# regulated rigor refuses a flow profile setting that turns a check off.
name: prototype.rigor
rule:
  match:
    - condition: policy.rigor == "regulated"
      output: '!record.flow.profile.exists(s, s.turns_check_off)'
      explanation: >-
        "regulated rigor refuses a flow profile that turns a check off"
    - output: "true"
