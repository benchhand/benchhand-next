# The prototype at 412b5d9: skills/cad-flow/references/flow.md, "Inner
# loop": "the form check on the unit's PNs (F1 at L1, F2 at L2, F3 from
# L3)", as a restricted cel-policy rule list (flow/rules.schema.json).
# flow.yaml names it as the fidelity list, so every output is "F0" to "F3".
# cad-design/references/fidelity.md puts concept at F0.
name: prototype.fidelity
rule:
  match:
    - condition: stage == "layout"
      output: '"F1"'
    - condition: stage == "parts"
      output: '"F2"'
    - condition: stage_order[stage] >= stage_order["detail"]
      output: '"F3"'
    - output: '"F0"'
