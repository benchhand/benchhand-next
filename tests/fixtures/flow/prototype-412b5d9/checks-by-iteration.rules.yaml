# The prototype at 412b5d9, written in the flow/rules.schema.json shape.
# "Checks by iteration": the first match per iteration and stage. A check
# with its own when runs only if that holds too. The list order is the
# fail-fast run order, cheapest first.
rules_version: 1
kind: checks_by_iteration
rules:
  - when: iteration == "inner" && stage == "layout"
    then:
      - validate
      - scratch.build
      - form_check.unit
      - evidence.check_scratch
      - check: sweep.smoke_changed
        when: version.moving_pairs_changed
      - check: render.visibility
        when: record.requirements.exists(r, r.binds_visibility)
  - when: >-
      iteration == "inner"
      && stage in ["parts", "detail", "reconcile"]
    then:
      - validate
      - scratch.build
      - form_check.unit
      - evidence.check_scratch
      - check: fits.stackup
        when: stage == "detail"
      - check: drawings.completeness_unit
        when: stage == "detail"
      - check: sweep.smoke_changed
        when: version.moving_pairs_changed
      - check: render.visibility
        when: record.requirements.exists(r, r.binds_visibility)
  - when: iteration == "inner" && stage == "analysis"
    then:
      - validate
      - fea.smoke_coarse
  - when: >-
      iteration == "commit"
      && stage in ["layout", "parts", "detail", "analysis", "reconcile"]
    then:
      - validate
      - build
      - static.changed_only
      - check: bom.reconcile
        when: stage.index >= stages.layout.index
      - check: fits.stackup
        when: stage.index >= stages.detail.index
      - check: form_check.changed
        when: stale.exists(s, s.family == "form" && s.changed)
      - check: sweep.smoke_changed
        when: version.has_independent_joint
      - check: drawings.parts
        when: >-
          stage.index >= stages.detail.index
          && stale.exists(s, s.family == "drawing")
      - check: sourcing.selection
        when: stale.exists(s, s.family == "sourcing")
      - render.views
      - check: motion.default_render
        when: version.has_independent_joint
      - recheck.stamp
  - when: iteration == "provisional"
    then:
      - validate.result
      - render.visibility_result
      - check: motion.default_render_result
        when: version.has_independent_joint
      - bom.result
      - fits.stackup_result
      - form_check.result
      - static.result
      - sweep.smoke_result
      - evidence.check_stage
  - when: iteration == "full"
    then:
      - validate
      - static.all_pairs
      - form_check.due
      - motion.default_render
      - bom.reconcile
      - fits.stackup
      - check: sweep.full
        when: >-
          stage in ["layout", "analysis"]
          || !version.full_sweep_carry_forward_proven
      - check: drawings.all
        when: stage == "detail"
      - check: fea.all_cases
        when: stage == "analysis"
      - check: fea.stale_cases
        when: stage == "reconcile" && stale.exists(s, s.family == "fea")
      - check: sourcing.selection
        when: stage in ["intent", "parts"]
      - evidence.check
      - recheck.stamp
  - when: iteration == "design_freeze"
    then:
      - validate
      - bom.reconcile
      - fits.stackup
      - evidence.check
      - recheck.stamp
      - check: sweep.full
        when: stale.exists(s, s.family == "sweep")
      - check: drawings.all
        when: stale.exists(s, s.family == "drawing")
      - check: fea.stale_cases
        when: stale.exists(s, s.family == "fea")
  - when: iteration == "release"
    then:
      - validate
      - bom.reconcile
      - build_guide
      - release
