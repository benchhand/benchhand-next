# Where each piece of the prototype (benchhand/benchhand, the local
# cad-agent) ends up in benchhand-next. One entry per prototype script,
# skill, agent and harness module, plus the resource directories they use.
# `just reference-map` checks it against the reference copy and writes
# docs/architecture/function-map.md.
#
# The reference copy is the prototype at reference_commit, read-only, named
# by BENCHHAND_REFERENCE_DIR. It has no agents/ directory, so the agent
# sources are looked up in this repository's reference/ too. Without a copy
# the check covers this file and the function map only.
#
# path: a file, a directory with a trailing `/`, or a glob.
# home: a path or a CLI command, or a list of them.
# phase: 0 to 7, from the Steps in docs/design-plan.md, or null for a planned
#   entry whose home waits on an open question (its note names the question).
# status: planned, in-progress, partial, ported or dropped (with a reason). A
#   partial entry's note says what is left out and which phase owns it.
# basis: inferred where the design-plan table doesn't name the home.
