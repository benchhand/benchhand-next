capabilities:

  # Phases 0 and 1: contracts and core, on main.
  - id: contracts-pipeline
    title: Contracts and code generation
    purpose: Every owned shape has one TypeSpec source under contracts/,
      emitted to JSON Schema 2020-12 and split into one published
      schema per contract. The Pydantic models, TypeScript types,
      conformance fixtures and reference docs are generated from the
      published schemas, and CI fails on drift, a TypeSpec warning,
      a lint finding or a breaking change without a major bump. Later
      phases add the MCP tool schemas, the CEL environment and the
      preview-host API.
    layer: contracts
    container: containers.md:published
    phase: 1
    status: built
    scope: baseline
    evidence:
      - justfile:106
      - tools/gen/contracts_gen/__main__.py:24
      - docs/contract/versioning.md
    owner:
      - contracts
      - tools/gen
    contracts_planned:
      - MCP tool inputs and outputs (plan section 6a)
      - benchhand.toml
      - the preview-host HTTP API and the App postMessage payloads
    prototype:
      - skills/cad-record/schemas/
    adrs:
      - 17
    no_tool_reason: Build-time tooling; nothing runs it through MCP.
  - id: contract-validation
    title: Runtime contract validation
    purpose: Validate any instance against a published schema by its
      $id and report every violation with its schema path, never a
      silent coercion. The record service uses it on every read and
      write; the MCP server, the provider host and the preview host
      are to use it at their boundaries in both directions.
    layer: contracts
    container: containers.md:validator
    phase: 1
    status: built
    scope: baseline
    evidence:
      - packages/benchhand-contracts/src/benchhand_contracts/validation.py:52
    owner:
      - packages/benchhand-contracts
    contracts:
      - record/product.schema.json
    prototype:
      - skills/cad-record/scripts/schema_registry.py
    depends_on:
      - contracts-pipeline
    adrs:
      - 17
    no_tool_reason: A library that every boundary calls.
  - id: provider-protocol-contract
    title: Provider protocol contract
    purpose: 'The JSON-RPC 2.0 protocol between the host and each
      provider process: LSP framing, initialize with version and capability
      negotiation, the hook params and results of every provider kind,
      progress, log and artifact messages, cancellation and error
      codes, plus the pre-spawn manifest. The prose and the TypeSpec
      contract are on main; the runtime that speaks it is Phase 4.'
    layer: contracts
    container: containers.md:published
    phase: 0
    status: built
    scope: baseline
    evidence:
      - contracts/provider/protocol.tsp
      - contracts/provider/manifest.tsp
      - docs/contract/provider-protocol.md
    owner:
      - contracts
    contracts:
      - provider/protocol.schema.json
      - provider/manifest.schema.json
    depends_on:
      - contracts-pipeline
    adrs:
      - 6
      - 13
      - 17
    no_tool_reason: A contract; the provider runtime and host implement
      it.
  - id: client-capability-probe
    title: Client capability probe (dev only)
    purpose: 'A throwaway stdio MCP server that a developer registers
      by hand in each host. It records what the host advertises and
      tries each interaction: forms, images, progress, long calls,
      resources, prompts and Apps. Its results in docs/client-support.md
      set the ADR-0018 baseline. It isn''t shipped and isn''t run
      in CI.'
    layer: dev-tooling
    container: layers.md:support
    phase: 0
    status: partial
    scope: baseline
    evidence:
      - tools/probe/probe.py
      - docs/client-support.md
    note: The Codex / ChatGPT desktop app was never run, and Kiro
      lists the probe tools without passing them to the model
      (docs/phases/phase-0-1.md:24).
    owner:
      - tools/probe
    adrs:
      - 16
      - 18
    no_tool_reason: Its MCP tools are the probe's own, not benchhand's.
  - id: record-store
    title: Record store, typed reads and writes
    purpose: 'Read and write the hw/ design record as typed documents:
      YAML, CSV and decision records, each validated against its contract
      before it touches disk, with file identity and round-trip checks
      on save. Every other record capability reads and writes through
      it.'
    layer: core
    container: containers.md:store
    phase: 1
    status: built
    scope: baseline
    evidence:
      - packages/benchhand-core/src/benchhand_core/record/store.py:313
      - packages/benchhand-core/src/benchhand_core/record/documents.py
    owner:
      - packages/benchhand-core
    contracts:
      - record/product.schema.json
      - record/part.schema.json
      - record/assembly.schema.json
      - record/interfaces.schema.json
      - record/requirements.schema.json
      - record/bom-row.schema.json
      - record/verification-row.schema.json
      - record/decision.schema.json
      - record/policy.schema.json
      - record/common.schema.json
    mcp:
      resources:
        - record
      phase: 3
      sources:
        - kind: plan
          ref: docs/design-plan.md:574
      baseline:
        - record.read
    prototype:
      - skills/cad-record/layout.json
      - skills/cad-record/scripts/yaml_loader.py
    depends_on:
      - contract-validation
    adrs:
      - 17
  - id: record-validate
    title: Record validation
    purpose: Check a whole record against its contracts and the cross-document
      rules (BOM, interfaces, assembly, drawing, decisions, verification)
      and report findings. It is how direct edits to hw/ are caught,
      as findings and not prevented (D3).
    layer: core
    container: containers.md:validate
    phase: 1
    status: partial
    scope: baseline
    evidence:
      - packages/benchhand-core/src/benchhand_core/record/validate.py:43
    note: The library is on main with no CLI or tool. The reference
      map keeps part of the prototype's validate.py for later phases,
      and its SARIF output is homed in Phase 3
      (skills/cad-record/scripts/sarif.py).
    owner:
      - packages/benchhand-core
    contracts:
      - common/finding.schema.json
    prototype:
      - skills/cad-record/scripts/validate.py
      - skills/cad-record/scripts/design_rules.py
      - skills/cad-record/scripts/assembly_data.py
      - skills/cad-record/scripts/sarif.py
      - skills/cad-record/vendor/
    depends_on:
      - record-store
    open_questions:
      - validate-surface
    adrs:
      - 3
      - 17
  - id: record-migrate
    title: Record migration
    purpose: 'Migrate a prototype record (record_version 2) to record
      version 3 as a table of rules, one row per prototype change:
      a dry run by default, an apply that backs up every file it changes,
      resume after a stop, and undo from the backup. Each later prototype
      change is ported as its own row with a fixture (ADR-0015).'
    layer: core
    container: containers.md:migrate
    phase: 1
    status: built
    scope: baseline
    evidence:
      - packages/benchhand-core/src/benchhand_core/record/migrate/service.py:674
      - packages/benchhand/src/benchhand/cli.py:34
    owner:
      - packages/benchhand-core
      - packages/benchhand
    contracts:
      - record/product.schema.json
      - record/decision.schema.json
    depends_on:
      - record-store
      - record-validate
    open_questions:
      - record-migrate-tool
      - cli-command-list
    adrs:
      - 15
      - 17
  - id: evidence-assessment
    title: Evidence assessment
    purpose: 'Read a built version and assess what each expected check,
      requirement and part has shown: obligations, sealed packets,
      waivers, staleness from input fingerprints, and the acceptance
      digest a freeze binds. It reads and assesses; nothing writes
      evidence yet.'
    layer: core
    container: containers.md:evidence
    phase: 1
    status: partial
    scope: baseline
    evidence:
      - packages/benchhand-core/src/benchhand_core/record/evidence/assess.py:383
      - packages/benchhand-core/src/benchhand_core/record/evidence/reader.py:394
    note: 'Left out: the stage and selection gates (Phase 2), release
      policy, stamped packets and version acceptance (Phase 4), and
      producer orchestration, which goes to check-orchestration (reference-map
      entry skills/cad-record/scripts/evidence.py).'
    owner:
      - packages/benchhand-core
    contracts:
      - record/evidence-assessment.schema.json
      - record/manufacturing-evidence.schema.json
      - record/manufacturing-check-result.schema.json
      - record/manufacturing-guideline.schema.json
      - record/bundle-manifest.schema.json
    prototype:
      - skills/cad-record/scripts/evidence.py
      - skills/cad-record/scripts/evidence_paths.py
      - skills/cad-record/scripts/check_packet.py
      - skills/cad-record/scripts/guidelines.py
      - skills/cad-record/scripts/manufacturing_intent.py
      - skills/cad-record/assets/manufacturing/
      - skills/cad-model/scripts/cadmodel/record.py
    depends_on:
      - record-store
    open_questions:
      - guideline-asset
      - freeze-digest
    adrs:
      - 17
      - 19
  - id: job-service
    title: Job service
    purpose: 'Run long work as jobs: each in its own session and process
      group, with pid-reuse-safe identity, progress, cancellation,
      reaping, and a run record under .benchhand/runs/. It is the
      baseline for work over the long-call threshold (ADR-0018): the
      jobs tools return a handle and the agent polls it.'
    layer: core
    container: containers.md:jobService
    phase: 1
    status: built
    scope: baseline
    evidence:
      - packages/benchhand-core/src/benchhand_core/jobs/service.py:119
      - packages/benchhand-core/src/benchhand_core/jobs/supervisor.py
    note: The scoped run claims and the stray-run report of the prototype's
      process_lifecycle.py are left to Phase 4, with the tools that
      run those jobs.
    owner:
      - packages/benchhand-core
    contracts:
      - jobs/job.schema.json
    prototype:
      - skills/cad-flow/scripts/process_lifecycle.py
    depends_on:
      - contract-validation
    open_questions:
      - cancel-tool
      - provider-job
    adrs:
      - 4
      - 18

  # Phase 2: flow engine.
  - id: flow-engine
    title: Flow engine
    purpose: 'Load flow.yaml (stages, gates and edges as data, every
      condition in CEL), check every standalone expression at load,
      and run the state machine: refuse an out-of-order transition
      with a reason and the next action, cascade a VOID to the later
      stages, and be the normal writer of flow.stage. Gates steer;
      they are not a security control (D3).'
    layer: core
    container: containers.md:flowEngine
    phase: 2
    status: planned
    scope: baseline
    source:
      kind: plan
      ref: docs/design-plan.md:552
    owner:
      - packages/benchhand-core
      - flow
    contracts:
      - flow/flow.schema.json
