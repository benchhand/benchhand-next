    adrs:
      - 14
    no_tool_reason: A page; preview.serve hosts it.
  - id: rich-interactions
    title: Apps, image results and tasks
    purpose: 'The enhancements over the baseline, only where a host
      declares them: the MCP App gate card and viewer shells embedding
      the preview page, the structured-question App (a form over nested
      schemas for the GROUND, INTENT and SPECIFY questions), image
      content and resource links for the agent, and the tasks adapter
      behind a flag. The App form is an MCP App; MCP form elicitation
      isn''t used (ADR-0018).'
