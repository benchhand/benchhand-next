  # Phase 6: harness integration.
  - id: harness-install
    title: Harness install
    purpose: '`benchhand install --harness X` writes, per host, the
      MCP registration with its timeouts, the bootstrap skill, the
      agent profiles generated from the neutral agents/*.md (keeping
      the tier and model rendering and the CHEAP_ELIGIBLE allowlist),
      and host extras such as the Pi package''s gate dialog.'
