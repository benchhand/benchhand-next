# The capability catalogue: benchhand's features, the MCP tools and CLI
# commands that expose them, and the prototype commands they replace. The
# single source that the per-feature specs split into work blocks.
#
# `just capabilities` checks this file against
# tools/catalogue/capability_catalogue/capabilities.schema.json and its cross
# references (capabilities, tools, the reference map, the published contracts,
# the ADRs and every path:line pointer), checks prototype_commands against
# docs/architecture/prototype-inventory.json, and `just capabilities --write`
# regenerates docs/architecture/capabilities.md from it.
#
# Conventions:
# - status, phase and every name come from a source; a pointer says which.
#   A tool or command no source names is `proposed`, with source `catalogue`
#   (this file's name for a prototype command the plan implies) or `study`
#   (the CAD-libraries study, lanes 8 and 8b, not in this repository).
# - A capability's tools and CLI commands are the entries of `tools` and `cli`
#   that name it; they are not repeated on the capability.
# - Where sources disagree, both are recorded in an open question.
contract_base: https://benchhand.github.io/benchhand/contracts/

doc_corrections:
  - pointer: docs/contract/envelope.md:37
    says: the design documents give two long-call thresholds, about
      50 s in plan section 11 and about 30 s in ADR-0018, and Phase
      3 settles it.
    correction: the threshold is about 30 s; plan section 11 and the
      provider protocol follow ADR-0018 since 2026-11-26.
    settled_by:
      - docs/design-plan.md:353
      - docs/adr/0018-baseline-and-no-forms.md:27
      - docs/adr/0018-baseline-and-no-forms.md:36
      - docs/architecture/data-flow.md:347

