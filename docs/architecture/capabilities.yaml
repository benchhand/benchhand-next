      - skills/cad-concept/scripts/concept.py
    depends_on:
      - concept-scene
      - record-ops
    adrs:
      - 7
  - id: flow-view
    title: Flow view
    purpose: 'React Flow draws flow.yaml and the project''s live state
      in the preview host and the gate card: the current stage, open
      gates, provisional and void history, and the evidence for each
      gate.'
    layer: ui
    container: containers.md:ui
    phase: 5
    status: planned
    scope: baseline
    source:
      kind: plan
      ref: docs/design-plan.md:594
    owner:
