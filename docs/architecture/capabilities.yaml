  - id: assembly-steps-and-coupons
    title: Assembly steps and joint evidence
    purpose: 'The 13 assembly operation kinds of ADR-0021: the pin''s
      10, plus `place`, `bench` and `hold`. `place` installs a part
      or a bench unit without making a joint, and #334''s `install`
      becomes `place`. Its `retained_by` is a list of later joining
      steps in the same build, or an open fact with a reason; the
      record validator requires it only when the placed part is
      delivered (`role: product`). `bench` opens a sub-build and names
      its base, and `hold` is a dwell with duration, fixture and orientation.
      Existing equipment may be the `part` of `place` and `disassemble`
      only. Joint evidence that needs a physical test comes from test
      coupons proposed from the verification rows, whose results record
      method, instrument, values, uncertainty and test conditions;
      a result passes only the conditions it was tested under.'
    layer: core
    container: containers.md:record
    phase: 2
    status: planned
    scope: baseline
    note: ADR-0021 supersedes plan section 12b, which requires `retained_by`
      naming one step on every `place` and never lets existing equipment
      be a step's `part` (docs/design-plan.md:439-441).
    source:
      kind: adr
      ref: docs/adr/0021-assembly-operation-kinds.md:18
    owner:
      - contracts
      - packages/benchhand-core
    contracts:
      - record/assembly.schema.json
