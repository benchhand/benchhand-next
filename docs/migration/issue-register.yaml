# Migration issue register: every issue found in the prototype
# (benchhand/benchhand) by the test project, by the prototype's lead sessions
# and by the agentcad product test, and every bead in the prototype's ledger,
# with how benchhand-next addresses it. The owner's rule: all of them are
# addressed in the new build.
# `just issues` checks this file against tools/issues/issue-register.schema.json
# and the reference map, and writes docs/migration/issue-register.md from it
# (`--write`). `just issues-sync` (local only) compares it with the live ledger
# and the test project's tool-issues log.
#
# This repository is public; the test project and the ledger are not. Every
# entry describes the tool's behaviour in generic terms and cites its source
# by name only:
#   test-project tool-issues #N, test-project brief <name> [item N],
#   test-project gate-vN-blockers, handoff §x, findings <area.number>,
#   design <name> <section or question>, handover-2026-11-20 §x,
#   decisions-while-away <entry>, pkgB <bead>-decision,
#   agentcad product test 2026-11-27, REPORT §<section> [item N],
#   plus bead ids and prototype PR numbers.
#
# disposition:
#   port-fix        the behaviour is ported with its test (the prototype's
#                   fix, or the right behaviour where the prototype is still
#                   wrong; prototype_status says which)
#   design-input    shapes a benchhand-next design or spec
#   contract        needs a contract field or rule
#   already-covered benchhand-next already has it or plans it (pointer)
#   not-applicable  with a reason
#   decide          needs the owner (recommendation)
# also: further dispositions, when one entry needs two.
# phase: the design-plan phase that owns the work, or null.

reference_commit: 412b5d9ae2faa420f909c1f50cc98a696651539f

