      a snapshot, one written after sealing doesn't stale the version,
      a version built before the change still verifies, and a cited
      artifact that is missing blocks the freeze; a snapshot that a
      global excludes file does not change; a project outside git
      with the same snapshot; scratch and release tests that leave
      junk out; and a managed-ignores test where setup leaves the
      user's top-level .gitignore byte-identical.
