  - id: RULE-28
    rule: An overlap below the measurement tolerance is a non-blocking
      sub-tolerance finding, not interference.
    sources:
      - handoff §4
      - handoff §1.4
    benchhand_next: Not built yet; the collision provider (IR-021)
