    disposition: contract
    pointer: docs/design/assembly-structure.md §Decisions
    benchhand_next:
      action: The owner's assembly-structure decisions of 2026-11-28.
        A build writes a product.step, grouped by built subassembly,
        then [Made] and [Purchased], with the kit beside it. It also
        writes a scene.step that is never released, holding [Context],
        [Tooling], [Joints], [Poses], [Envelopes], [Findings] and
        [Construction].
        Hidden-by-default rules apply, sections are saved views, and
        a single part follows the same rules. The checks read the scene,
        and the release and the BOM read the product. The occurrence
        roles come from IR-003 and IR-025, and a variant is its own
        project (IR-010).
      phase: 2
    acceptance: 'Export tests on a synthetic assembly with one context
      part, one tool and one kit item: product.step holds the made and
      purchased parts in their groups, and the kit; scene.step holds
      all of them, with the hidden flags the note sets; the release
      refuses a product file that contains a context or tooling part;
      and a single-part export has the same groups.'
