      - agentcad product test 2026-11-27, REPORT §quality
    prototype_status: open
    area: cad-record
    prototype_paths:
      - skills/cad-record/scripts/emit.py
      - skills/cad-model/scripts/cad_model.py
    disposition: contract
    also:
      - design-input
    benchhand_next:
      action: The envelope lists blocking findings first. An interference
        finding names both PNs and the mm³; a build error carries its
        PN and file and line, through an optional Finding line and
        the kernel build result's error location (design note, gain
        4).
      phase: 3
    acceptance: Envelope tests where an undeclared overlap gives a
      first finding naming both PNs and the mm³, and a failing fillet
      gives a first finding with the PN, the model file and its line.
  - id: IR-201
    title: A successful diff that finds changes reports status unknown,
      because the emitter takes a verdict from fields a diff doesn't
      have.
    kind: bug
    sources:
      - agentcad product test 2026-11-27, REPORT §bugs item 4
    prototype_status: open
    area: cad-record
    prototype_paths:
      - skills/cad-record/scripts/emit.py
      - skills/cad-model/scripts/cad_model.py
    disposition: already-covered
    pointer: docs/contract/envelope.md §Status and verdict
    benchhand_next:
      action: The envelope keeps the call's status apart from a check's
        verdict, and only a check-type tool sets a verdict, so a diff
        returns status ok with no verdict.
      phase: 4
    acceptance: A model.diff test on two versions that differ, which
      returns status ok, no verdict and the changed parts.
  - id: IR-202
    title: A killed build leaves its staging folder behind for good,
      and while it is there the store's garbage collection refuses
      to run.
    kind: bug
    sources:
      - agentcad product test 2026-11-27, REPORT §bugs item 6
      - agentcad product test 2026-11-27, REPORT §quality
    prototype_status: open
    area: cad-model
    prototype_paths:
      - skills/cad-model/scripts/cadmodel/build.py
    disposition: port-fix
    benchhand_next:
      action: The build stages its version in a folder named by its
        job id, and the version store collects a staging folder whose
        job has ended, judged by the job record's process identity
        (design note, gain 5).
      phase: 2
    acceptance: A version-store test that kills a staging build, starts
      the service again and finds the staging folder collected and
      the latest version unchanged, and a staging folder of a running
      job that is kept.
  - id: IR-203
    title: Every STEP write puts OCCT transfer banners with ANSI colour
      codes on stderr.
    kind: bug
    sources:
      - agentcad product test 2026-11-27, REPORT §bugs item 5
    prototype_status: open
    area: cad-model
    prototype_paths:
      - skills/cad-model/scripts/cadmodel/stepfile.py
      - skills/cad-model/scripts/cadmodel/runner.py
    disposition: port-fix
    benchhand_next:
      action: The kernel worker silences OCCT's default message printers
        and sends OCCT messages as structured $/log lines (provider
        protocol §5).
      phase: 4
    acceptance: A kernel-provider test that writes a STEP file and
      finds no OCCT banner and no ANSI escape on stderr, with the
      transfer messages as $/log lines.
  - id: IR-204
    title: The assembly drawing prints about 24 KB of indented JSON
      instead of the short summary and handle the other producers
      use.
    kind: bug
    sources:
      - agentcad product test 2026-11-27, REPORT §bugs item 7
    prototype_status: open
    area: cad-drawings
    prototype_paths:
      - skills/cad-drawings/scripts/assembly_drawing.py
    disposition: design-input
    benchhand_next:
      action: The drawing tool returns the envelope like every other
        tool, with the full report as an artifact, under the envelope
        bound that the bounded-results proposal sets (design note,
        gain 4).
      phase: 4
    acceptance: A drawing-tool test whose result stays under the envelope
      bound and lists the full report as an artifact.
  - id: IR-205
    title: A changed-only check re-runs every check other than pair
      geometry on the unchanged parts, so it takes as long as a full
      check.
    kind: bug
    sources:
      - agentcad product test 2026-11-27, REPORT §speed
      - agentcad product test 2026-11-27, REPORT §fixed-time
    prototype_status: open
    area: cad-model
    prototype_paths:
      - skills/cad-model/scripts/cadmodel/check.py
      - skills/cad-model/scripts/cadmodel/manufacture.py
      - skills/cad-motion/scripts/pose.py
      - skills/cad-motion/scripts/incremental.py
    disposition: design-input
    also:
      - contract
    benchhand_next:
      action: Per-part facts (mass properties, validity, export read-back,
        drawing features, the posing definition) are cached by the
        sha256 of their input files and the producing code digest,
        so an unchanged part costs one lookup (design note, gain 1).
        A STEP input is keyed by the sha256 of its data section only,
        ignoring the header (design note Q6).
      phase: 4
    acceptance: A check test on a synthetic assembly where, after
      one part changes, only that part's facts are computed and the
      others come from the cache, and an identical re-check reads
      no STEP file. A STEP file that differs only in its header is
      a cache hit.
  - id: IR-206
    title: Every check hashes the whole code closure again, although
      the code can't change while the process runs.
    kind: gap
    sources:
      - agentcad product test 2026-11-27, REPORT §fixed-time
    prototype_status: open
    area: cad-motion
    prototype_paths:
      - skills/cad-motion/scripts/code_shas.py
      - skills/cad-model/scripts/cadmodel/check.py
    disposition: design-input
    also:
      - contract
    benchhand_next:
      action: Each provider reports its code digest once, in initialize,
        and the host and the fact cache use that value (design note,
        gain 1).
      phase: 4
    acceptance: A provider-runtime test that counts one code digest
      per provider process over several checks.
  - id: IR-207
    title: Every build starts a fresh kernel process that imports
      the kernel again, about 3 s each time.
    kind: gap
    sources:
      - agentcad product test 2026-11-27, REPORT §speed
      - agentcad product test 2026-11-27, REPORT §gains item 1
    prototype_status: open
    area: cad-model
    prototype_paths:
      - skills/cad-model/scripts/cadmodel/runner.py
      - skills/cad-model/scripts/cadmodel/scriptenv.py
    disposition: design-input
    benchhand_next:
      action: The kernel providers stay resident and fork a worker
        per job before any boolean runs; every result reports whether
        it ran warm, and why not (design note, gain 2; an ADR first).
        On Windows the resident kernel takes a cold path and reports
        warm false (design note Q1).
      phase: 4
    acceptance: A conformance case that runs a boolean in a forked
      worker within the hook deadline, a forced cold run whose
      result reports warm false with a reason, and a platform without
      fork whose result reports warm false with that reason.
  - id: IR-208
    title: The edit loop takes three calls, a build, a check and a
      diff, and the diff reloads every STEP file.
    kind: gap
    sources:
      - agentcad product test 2026-11-27, REPORT §speed
      - agentcad product test 2026-11-27, REPORT §gains item 3
    prototype_status: open
    area: cad-model
    prototype_paths:
      - skills/cad-model/scripts/cad_model.py
      - skills/cad-model/scripts/cadmodel/diff.py
    disposition: design-input
    benchhand_next:
      action: One edit-loop job builds, then checks and diffs only
        the changed parts from the shapes the resident kernel holds,
        and returns the changed parts, their volume deltas and the
        blocking findings (design note, gain 3).
      phase: 4
    acceptance: An edit-loop test on a synthetic assembly after a
      one-part edit that returns that part as changed, its shared,
      A-only and B-only volumes, and no STEP reload of an unchanged
      part.
  - id: IR-209
    title: The first start builds the kernel environments one after
      the other, about 4 minutes cold.
    kind: gap
    sources:
      - agentcad product test 2026-11-27, REPORT §speed
      - agentcad product test 2026-11-27, REPORT §gains item 7
    prototype_status: open
    area: cad-flow
    prototype_paths:
      - skills/cad-flow/scripts/preflight.py
    disposition: design-input
    benchhand_next:
      action: The host warms the provider environments in parallel,
        with progress in env.doctor (design note, gain 6).
      phase: 4
    acceptance: An environment test with two fake providers whose
      builds overlap in time, and a doctor report that shows both
      in progress.
  - id: IR-210
    title: A product render of four views takes about 18 s, and nobody
      knows where the time goes.
    kind: gap
    sources:
      - agentcad product test 2026-11-27, REPORT §speed
      - agentcad product test 2026-11-27, REPORT §gains item 6
    prototype_status: open
    area: cad-render
    prototype_paths:
      - skills/cad-render/scripts/render.py
    disposition: design-input
    benchhand_next:
      action: Profile the render first, then keep Chromium resident
        with one warm page per project, cache renders by GLB sha256,
        camera, pose, size and renderer code digest, and add an OCC
        offscreen preview only if it is still slow (design note,
        rendering plan).
      phase: 4
    acceptance: A render profile that attributes the time to launch,
      load, pose, render and write, and a render test where a repeated
      render with the same key is a cache hit.
  - id: IR-211
    title: A build killed with its caller loses its work, and a retry
      can't tell a replay from a new build.
    kind: gap
    sources:
      - agentcad product test 2026-11-27, REPORT §quality
      - agentcad product test 2026-11-27, REPORT §gains item 5
    prototype_status: open
    area: cad-model
    prototype_paths:
      - skills/cad-model/scripts/cad_model.py
      - skills/cad-model/scripts/cadmodel/build.py
    disposition: contract
    also:
      - design-input
    benchhand_next:
      action: A build runs as a job that a dropped call doesn't end,
        and jobs.start takes an idempotency key bound to the inputs;
        the same key and inputs replay the job, and different inputs
        are refused as a conflict (design note, gain 5). Jobs end with
        the session, and a client that disconnects while the server
        is still up can still fetch the job's result (design note
        Q2).
      phase: 3
    acceptance: Job-service tests where a replayed key starts no second
      job, a key with changed inputs is refused with a reason, a
      dropped call's job is still reported by jobs.status, and a
      client that disconnects while the server runs can fetch the
      job's result.
  - id: IR-212
    title: No test checks a declared and an undeclared overlap in
      the same assembly.
    kind: gap
    sources:
      - agentcad product test 2026-11-27, REPORT §quality
    prototype_status: open
    area: cad-model
    prototype_paths:
      - skills/cad-model/scripts/cadmodel/check.py
      - skills/cad-motion/scripts/pair_policy.py
    disposition: port-fix
    benchhand_next:
      action: The interference check ports RULE-39 with one test that
        holds both overlaps, and two more cases, a declared fit whose
        overlap exceeds its limits and a declared fit with zero overlap
        (design note, interference rule).
      phase: 4
    acceptance: An interference test on one synthetic assembly with
      a declared press-fit overlap within its limits and an undeclared
      overlap above the collision provider's stated tolerance, where
      the verdict is fail, exactly one finding blocks and names the
      undeclared pair and its mm³, and the declared pair's row is
      allowed with its fit, interface id and mm³. A case where a
      declared fit's overlap exceeds its limits fails with exactly
      one blocking finding that names the fit, its interface id,
      the mm³ and the limit. A declared fit with zero overlap raises
      no finding.

