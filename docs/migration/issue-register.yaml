  - id: RULE-29
    rule: The near-support force and moment tolerance and the twist
      floor are recorded engineering judgement, and ductility comes
      from a sourced elongation-at-break field. The elongation entry
      carries an optional gauge, and a value with no gauge can't
      be compared with a ductility threshold.
    sources:
      - decisions-while-away U-2
      - decisions-while-away U-3
      - decisions-while-away §before-leaving
      - pkgB 2dq3-decision
      - pkgB 2dq3-decision2
    benchhand_next: Not built yet; the analysis port (Phase 4) carries
      the values and their recorded basis, and the material contract
      carries the gauge (IR-188).
  - id: RULE-30
    rule: The near-support check for metals stays behind its feature
      flag until a source states the elongation gauge for each shipped
      metal profile.
    sources:
      - pkgB y87-decision2
      - decisions-while-away U-5
      - decisions-while-away U-8
    benchhand_next: Owner decision of 2026-11-27 (IR-188). The new
      build ships no flag; the analysis port (Phase 4) carries RULE-38.
    conflict:
      prototype: The near-support check for metals stays behind a
        feature flag until every shipped metal profile has a sourced
        gauge.
      benchhand_next: No flag. The check is on for every metal, and
        a metal is ductile for it only when its gauge is sourced
        (RULE-38).
  - id: RULE-31
    rule: A near-support check may fail a part only on a successful,
      cross-checked stress linearisation; otherwise it passes or
      abstains as unknown.
    sources:
      - decisions-while-away §before-leaving
    benchhand_next: Not built yet; the analysis port (Phase 4) carries
      it.
  - id: RULE-32
    rule: A guideline value with no qualifying source is left out,
      so the check it feeds reports unknown (a press-fit allowance,
      for example).
    sources:
      - decisions-while-away U-4
      - pkgB 40u-verdict
    benchhand_next: Consistent with the shipped guideline sets the
      Phase 1 evidence service reads; the fits port (Phase 4) keeps
      it.
  - id: RULE-33
    rule: A discrete set of machine values and a material range
      combine as joint constraints, resolving to their intersection.
    sources:
      - decisions-while-away §before-leaving
    benchhand_next: Not built yet; guideline limit resolution is
      Phase 4.
  - id: RULE-34
    rule: The not_assessed result orders fail, unknown, not_assessed,
      pass. A packet of passes and not-assessed checks reports not_assessed,
      never pass.
    sources:
      - decisions-while-away U-11
      - handoff §1.2
    benchhand_next: The record contracts carry not_assessed as a
      result distinct from pass.
    pointer: contracts/record/manufacturing-check-result.tsp
  - id: RULE-35
    rule: A stage advance is approved only by its gate's decision
      record, which states the transition it approves; a recheck
      stamp binds to that transition, not to a date.
    sources:
      - decisions-while-away U-13
      - handoff §1.2
    benchhand_next: Decision records and the stage gates are Phase
      2; scoped approvals follow ADR-0019.
    pointer: docs/adr/0019-scoped-reapproval.md
  - id: RULE-36
    rule: 'Owner direction of 2026-11-27 on bead benchhand-03vn,
      refined the same day. A part with nothing to freeze is an
      explicit not_applicable with its reason, and its gate stays
      open to pass. Examples are a customer envelope with no datasheet
      and a make_buy existing part. Unknown still never passes,
      and what is known about the part (its source, measured or
      customer-stated) is recorded. A standard ISO or DIN part needs
      no paywalled standard. The agent itself takes its dimensions
      from a standard library, in this order: (1) the bd_warehouse
      data tables, recording the package version and the table row;
      (2) the FreeCAD Fasteners workbench, run out of process as
      a generator with none of its data files copied, recording
      its version, the table and row and the hash of the generated
      STEP; (3) open tables such as the Onshape hole tables and
      BOSL2; (4) a supplier datasheet for that exact designation,
      frozen with reference, date, sha256 and URL. The designation
      and edition identify the part, and the library row is the
      basis for its dimensions. When no source covers the designation,
      that is a named finding with the search recorded, and it does
      not block. A part with no supplier chosen stays open as a
      sourcing decision.'
    sources:
      - 'test-project tool-issues #35'
      - 'test-project tool-issues #3'
      - handoff §1.4
      - findings 7.9
    benchhand_next: Not built yet. Its home is the standards-data
      package from the CAD study (the bd_warehouse, Fasteners, Onshape
      and BOSL2 tables) and a parts.search tool, Phase 4, with the
      part-source providers; the owner decided this on 2026-11-28
      (IR-047). The procurement not_applicable reason in the record
      contract stays in Phase 2, with existing equipment (IR-003).
    pointer: docs/design-plan.md §12
  - id: RULE-37
    rule: 'Owner decision of 2026-11-27 (IR-026). Parallel work
      units allocate record ids per work unit, each from its own
      prefix or reserved block, and the merge step renumbers them
      and rewrites every reference. Two units never pick the same
      id.'
    sources:
      - 'test-project tool-issues #21'
      - handoff §1.4
    benchhand_next: Not built yet. The work-unit service implements
      the scheme; the phase is not assigned.
  - id: RULE-38
    rule: 'Owner decision of 2026-11-27 (IR-188). A metal counts
      as ductile for the near-support check only when its profile
      has a sourced elongation gauge. Without one, the check stays
      strict, and no feature flag controls it.'
    sources:
      - decisions-while-away U-5
      - decisions-while-away U-8
      - pkgB y87-decision2
    benchhand_next: Not built yet; the analysis port (Phase 4) and
      the material contract carry it (RULE-30, RULE-31).
  - id: RULE-39
    rule: Interference the record declares is allowed within the
      declared fit's own limits (IR-115). A declared interference
      press or locating fit, a heat-set insert on exactly that occurrence
      pair, or an explicit allow of the pair is reported as allowed,
      with its declared fit, its interface id and the measured mm³.
      A declared fit's overlap above its limits blocks, with a finding
      that names the fit, its interface id, the measured mm³ and
      the limit; an explicit allow and a heat-set insert name no
      fit limits. A declared fit with zero overlap counts as realised
      (RULE-16). Any other overlap above the collision provider's
      stated tolerance blocks (RULE-28), with no fixed threshold,
      and one at or below it is a non-blocking sub-tolerance finding;
      an unknown measurement still fails (RULE-05).
    sources:
      - agentcad product test 2026-11-27, REPORT §quality
    benchhand_next: Not built yet; the interference check (Phase
      4) ports it with the mixed test (IR-212). The owner decided
      the threshold and the fit limits on 2026-11-27 (design note
      Q3).
    pointer: docs/design/edit-loop-performance.md §Interference rule
  - id: RULE-40
    rule: 'Owner decision of 2026-11-27 (CAD-libraries D-5). A bought
      part described only by an envelope clears the F3 fidelity level
      as F3-envelope: the record states its dimension source (datasheet,
      measurement or customer), and the gate shows a warning. Nothing
      blocks. A supplier STEP, or a generated STEP that the maker verified,
      gives F3-as-bought. At release, the BOM and the release notes
      list every part that is envelope only. A standard ISO or DIN part
      takes its geometry in the library order of RULE-36.'
    sources:
      - cad-libraries decision D-5
      - 'test-project tool-issues #25'
    benchhand_next: Not built yet. The levels and the dimension source
      are Phase 2 record additions (catalogue purchased-part-fidelity),
      and the fidelity rule list and the release refusals read them
      (IR-031).
    pointer: docs/design/cad-libraries-2026-11-27.md §Decisions
  - id: RULE-41
    rule: 'Owner decision of 2026-11-27 (CAD-libraries D-6). A supplier
      STEP''s sha256 is always recorded. Its bytes are committed only
      where the supplier''s terms allow it. A run fails only when a
      STEP frozen as required evidence is missing or changed, never
      for an optional one.'
    sources:
      - cad-libraries decision D-6
    benchhand_next: Not built yet; the supplier STEP import (Phase 4)
      implements it.
    pointer: docs/design/cad-libraries-2026-11-27.md §Decisions
  - id: RULE-42
    rule: 'Owner decision of 2026-11-27 (CAD-libraries D-7). On a supplier
      site whose terms are unread or restrictive, the user approves
      each download and the agent downloads the file on the user''s
      behalf. benchhand never asks a supplier for permission; that
      is the user''s call.'
    sources:
      - cad-libraries decision D-7
    benchhand_next: Not built yet; the supplier STEP import and the
      part-source providers (Phase 4) ask for the approval.
    pointer: docs/design/cad-libraries-2026-11-27.md §Decisions
  - id: RULE-43
    rule: 'Owner decision of 2026-11-27 (CAD-libraries D-16). The thread
      wrapper''s guard is always on: the result is one valid solid, and
      its net volume gain or removal is within tolerance of the expected
      value. A bare minimum-gain check is not enough. Other callers
      get the same checks as an opt-in guard on safe_cut and safe_fuse,
      whose generic contract stays as it is.'
    sources:
      - cad-libraries decision D-16
    benchhand_next: Not built yet; the SDK thread helper and the safe
      Booleans (Phase 4) implement it (IR-024).
    pointer: docs/design/cad-libraries-2026-11-27.md §Decisions
  - id: RULE-44
    rule: 'Owner decision of 2026-11-27 (CAD-libraries D-17). GPL and
      AGPL tools (slicers, gmsh, CalculiX, the FCGear addon) run only
      as separate processes or containers, never imported. benchhand
      downloads the pinned upstream file and checks its sha256, and
      never rehosts it. The owner signs off before a Dockerfile that
      fetches AGPL code ships.'
    sources:
      - cad-libraries decision D-17
    benchhand_next: Plan section 6 states it. The solver, slicer and
      part-source providers (Phase 4) follow it.
    pointer: docs/design-plan.md §CAD-libraries decisions (2026-11-27)
  - id: RULE-45
    rule: 'Owner decision of 2026-11-27 (CAD-libraries D-25). A supplier''s
      published specification counts as calibration, with the source
      kind supplier. It can turn UNKNOWN into pass or fail, and the
      record shows that the figure is supplier data.'
    sources:
      - cad-libraries decision D-25
    benchhand_next: Not built yet; a Phase 2 record addition (catalogue
      supplier-calibration), read by the process checks.
    pointer: docs/design/cad-libraries-2026-11-27.md §Decisions
  - id: RULE-46
    rule: 'Owner decision of 2026-11-27 (CAD-libraries D-32). A design
      adopted from another project is rewritten by default. A file
      is ported only when the owner approves that file, and then it
      keeps its licence notice, for example agentcad''s Apache-2.0 notice
      on solid_compare.py or edit_risk.py.'
    sources:
      - cad-libraries decision D-32
    benchhand_next: The plan's rewrite rule (section 4) already holds
      it; model.diff and model.inspect (Phase 4) follow it.
    pointer: docs/design-plan.md §4

  - id: RULE-47
    rule: Owner decision of 2026-11-28 on the concept overlay. An overlay
      may move or hide existing parts and add simple solids or STEP
      parts. It never stretches a real part. Every overlay is stamped
      as a concept overlay and never counts as record geometry.
    sources:
      - handoff §4
      - 'test-project tool-issues #42'
    benchhand_next: Not built yet; the render tool and viewer overlay
      mode of IR-213 (Phase 5).

issues:
  - id: IR-001
    title: The gate's form judge ignores approved waivers and dispositions,
      so an accepted waiver can't settle a fail at any gate.
    kind: false-fail
    sources:
      - 'test-project tool-issues #1'
      - test-project brief architect-prompt-tool-issues item 5
      - handoff §1.4
      - findings 1.1
    beads:
      - benchhand-89k
      - benchhand-glk.1
    prototype_status: open
    area: cad-record
    prototype_paths:
      - skills/cad-record/scripts/evidence.py
    disposition: design-input
    benchhand_next:
      action: The Phase 2 stage gates judge each obligation from
        the evidence assessment, which already applies approved,
        scoped dispositions, never from the raw packet outcomes.
      phase: 2
    acceptance: A gate test where a process-check fail settled by
      an approved waiver bound to the bundle does not block, and
      the same fail without it does.
  - id: IR-002
    title: The mounting check fails a bought part placed more than
      once before its stage, where a single placement is unknown.
    kind: false-fail
    sources:
      - 'test-project tool-issues #2'
      - test-project brief architect-prompt-tool-issues item 6
    beads:
      - benchhand-6cf
    prototype_status: open
    area: cad-design
    prototype_paths:
      - skills/cad-design/scripts/process_checks/purchased.py
    disposition: port-fix
    benchhand_next:
      action: A producer reports unknown for an obligation whose
        earliest stage is later than the current one, whatever the
        number of placements.
      phase: 4
    acceptance: A checks-process test where a part placed twice
      with no operations is unknown at layout and fails only once
      operations are due.
  - id: IR-003
    title: No category for customer-furnished reference geometry,
      which then needs purchase facts and ships in the product export,
      BOM and release.
    kind: gap
    sources:
