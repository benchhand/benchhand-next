      - test-project brief architect-prompt-reference-geometry
      - test-project brief architect-prompt-tool-issues item 14
      - handoff §1.2
    beads:
      - benchhand-pcy
      - benchhand-pcy.1
      - benchhand-pcy.2
      - benchhand-pcy.3
      - benchhand-ci7.3
    prototype_prs:
