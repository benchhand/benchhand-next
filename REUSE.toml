version = 1

# Source files (.py, .tsp, .mjs, .go, .rs, .sh, workflows, justfile) carry their own SPDX header, so a new
# source file without one fails `reuse lint`. This file covers what cannot carry a comment, or must stay
# byte-identical: data, documents, lockfiles, binaries, fixtures, generated output and the frozen prototype.
# Precedence is "closest": a header inside a file wins over the table.

# Data, documents, lockfiles and binaries, by extension. YAML is listed by location, not by extension: a
# `**/*.yml` entry would give a workflow without a header a valid licence, and the workflows carry their own.
[[annotations]]
path = [
  "**/*.json",
  "**/*.jsonl",
  ".pre-commit-config.yaml",
  "contracts/*.yaml",
  "docs/**/*.yaml",
  "packages/*/tests/**/*.yaml",
  "research/**/*.yaml",
  "tests/fixtures/**/*.yaml",
  "ui/*.yaml",
  "**/*.toml",
  "**/*.csv",
  "**/*.txt",
  "**/*.md",
  "**/*.lock",
  "**/*.sum",
  "**/*.mod",
  "**/*.svg",
  "**/*.d2",
  "**/*.proto",
  "**/*.binpb",
  "**/*.celpolicy",
  "**/.gitignore",
  "**/.python-version",
  "NOTICE",
  "ui/**/pnpm-lock.yaml",
  "contracts/pnpm-lock.yaml",
  "site/pnpm-lock.yaml",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Sjors Robroek"
SPDX-License-Identifier = "MPL-2.0"

# Generated output. The generators (tools/gen) write these files and `just contracts-drift` compares them
# byte for byte, so the licence comes from this table and not from a header the generators would have to
# emit in Python, TypeScript, JavaScript and Markdown. A hand-written file added here gets no lint error from
# reuse, but `just contracts-check` (the CI `check` job) fails on it: `contracts_gen check` lists every file in
# these directories that a fresh generation does not write (`extra`; tests/test_contracts_gen.py).
[[annotations]]
path = [
  "packages/benchhand-contracts/src/benchhand_contracts/models/**",
  "packages/benchhand-contracts/src/benchhand_contracts/schemas/**",
  "packages/benchhand-contracts/src/benchhand_contracts/examples/**",
  "ui/shared/contracts/**",
  "docs/contract/generated/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Sjors Robroek"
SPDX-License-Identifier = "MPL-2.0"

# The prototype's tests and fixtures (reference/, read-only, ADR-0015). The fixtures and the files the
# tests compare byte for byte cannot take a header.
[[annotations]]
path = "reference/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Sjors Robroek"
SPDX-License-Identifier = "MPL-2.0"

# Third-party files keep their own copyright and licence (NOTICE). Later tables win.
[[annotations]]
path = [
  "reference/skills/cad-model/tests/fixtures/3mf-schema/3mf-core.xsd",
  "reference/skills/cad-model/tests/fixtures/3mf-schema/LICENSE.spec_core",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2018, 3MF Consortium"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = [
  "reference/skills/cad-model/tests/fixtures/3mf-schema/opc-contentTypes.xsd",
  "reference/skills/cad-model/tests/fixtures/3mf-schema/opc-relationships.xsd",
  "reference/skills/cad-model/tests/fixtures/3mf-schema/LICENSE.test_suites",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2021, 3MF Consortium"
SPDX-License-Identifier = "BSD-2-Clause"

# W3C's xml.xsd states no licence; W3C publishes its documents under the W3C Document License
# (https://www.w3.org/copyright/intellectual-rights/). The SPDX list has no id for it.
[[annotations]]
path = "reference/skills/cad-model/tests/fixtures/3mf-schema/xml.xsd"
precedence = "override"
SPDX-FileCopyrightText = "World Wide Web Consortium"
SPDX-License-Identifier = "LicenseRef-W3C-Document-2023"

# cel-spec's simple conformance tests in protobuf JSON, exported from @bufbuild/cel-spec 0.6.2 by
# research/cel-neutral/ts/export_suite.ts. The summary of what the export dropped is derived from it.
[[annotations]]
path = ["research/cel-neutral/conformance/suite.json", "research/cel-neutral/conformance/suite-summary.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["Google LLC", "2024-2026 Buf Technologies, Inc."]
SPDX-License-Identifier = "Apache-2.0"

# Spec Kit (github/spec-kit v1.4.5): files written by `specify init --integration pi` from its MIT templates
[[annotations]]
path = [".specify/**", ".pi/prompts/speckit.*.md"]
precedence = "override"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "MIT"
