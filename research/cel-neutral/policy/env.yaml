# The checks-by-iteration scope in cel-go env YAML, for the engines that
# evaluate the compiled policy. env.json is the same scope in the cel-expr
# CLI's JSON form.
name: checks_by_iteration
extensions:
  - name: optional
  - name: bindings
variables:
  - name: stage
    type_name: string
  - name: iteration
    type_name: string
  - name: part
    type_name: benchhand.contracts.record.part.Part
