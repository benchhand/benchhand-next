# The environment every conformance runner builds, as cel-go env YAML.
# cel-go and cel-expr-python read it as is; the Rust and TypeScript
# runners map each extension by name.
name: conformance
extensions:
  - name: strings
    version: latest
  - name: math
    version: latest
  - name: encoders
  - name: optional
    version: latest
  - name: bindings
  - name: lists
    version: latest
  - name: two-var-comprehensions
