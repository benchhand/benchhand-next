[project]
name = "benchhand-contracts"
version = "0.0.0"
description = "Models and validators generated from benchhand's JSON Schema contracts. Never hand-edited."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "jsonschema>=4.23", "referencing>=0.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchhand_contracts"]
