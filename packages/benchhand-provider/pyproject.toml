[project]
name = "benchhand-provider"
version = "0.0.0"
description = "Runtime and conformance kit for benchhand providers (JSON-RPC 2.0 over stdio)."
requires-python = ">=3.11"
dependencies = ["benchhand-contracts"]

[tool.uv.sources]
benchhand-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchhand_provider"]
