[project]
name = "benchhand"
version = "0.0.0"
description = "Agent-guided mechanical CAD: the benchhand MCP server, preview host and CLI."
requires-python = ">=3.12"
dependencies = ["benchhand-core", "typer>=0.15"]

[project.scripts]
benchhand = "benchhand.cli:app"

[tool.uv.sources]
benchhand-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchhand"]
