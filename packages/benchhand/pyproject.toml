[project]
name = "benchhand"
version = "0.0.0"
license = "MPL-2.0"
license-files = ["LICENSE"]
description = "Agent-guided mechanical CAD: the benchhand MCP server, preview host and CLI."
requires-python = ">=3.12"
dependencies = ["benchhand-core", "openfeature-sdk==0.10.0", "pyyaml>=6.0", "typer>=0.15"]

[project.scripts]
benchhand = "benchhand.cli:app"

[tool.uv.sources]
benchhand-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchhand"]
