name: secrets
# Secrets anywhere in the history, on every pull request (forks included) and every push to `main`. There is
# no path filter: the pre-commit hook skips this scan in CI (`just hooks`), so this workflow is the only gate
# a source-only change meets. Offline, and the gitleaks CLI needs no licence key or secret, so a fork's
# read-only token is enough. (gitleaks-action needs a licence key for organisations, which is why the CLI is
# used directly.) .gitleaks.toml lists the false positives.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.59.0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_LOCKED: "1"
        with:
          version: 2026.11.6
          install_args: gitleaks
          cache: false
      - run: just secrets-history
