name: ci
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ["reference/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job, one runner, one environment sync. Keep it that way: add steps here
# instead of new jobs or matrix entries unless a check truly needs another OS.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - name: Prose gate on changed Markdown
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=AM FETCH_HEAD -- '*.md' ':!reference/**' ':!docs/design-plan.md')
          if [ -n "$files" ]; then uvx slopvac $files; fi
