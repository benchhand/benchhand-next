name: ci
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ["reference/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The PR job runs unit, contract and API tests (docs/testing.md). End-to-end tests
# with real kernels and FreeCAD get their own job when they exist: main, nightly and
# PRs labelled `e2e`. Add a step only when it catches a failure that matters.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the breaking-change check compares with the last v* release tag
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: extractions/setup-just@v3
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Contract tools pinned in contracts/package.json
        run: pnpm install --frozen-lockfile
        working-directory: contracts
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - name: Built wheels run outside the checkout
        run: uv run pytest -m wheel
      - name: TypeScript types, the generated contract types included
        run: just typecheck
      - name: Contract format, schema lint and breaking changes (ADR-0017)
        run: just contracts-check
      - name: Regenerated contracts match the commit (ADR-0017)
        run: just contracts-drift
      - name: Prose gate on changed Markdown
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=AM FETCH_HEAD -- '*.md' ':!reference/**' ':!docs/design-plan.md')
          if [ -n "$files" ]; then uvx slopvac $files; fi
