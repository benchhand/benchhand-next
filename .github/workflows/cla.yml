name: cla
# Contributor License Agreement (CLA.md). Signatures go to benchhand/cla-signers (signatures/cla.json on main).
# The workflow reads the pull request's metadata and never checks out its code, which is what makes
# pull_request_target safe here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: write
    # A comment starts the job only when it is on a pull request and is a signing comment or `recheck`; this
    # runs before the token step, so no other comment mints a token for benchhand/cla-signers.
    if: |
      github.event_name == 'pull_request_target'
      || (github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && (github.event.comment.body == 'recheck'
      || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # A token for the signatures repository only; GITHUB_TOKEN cannot write to another repository.
      - name: Token for benchhand/cla-signers
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.CLA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: benchhand
          repositories: cla-signers
          permission-contents: write
      - name: CLA Assistant
        # The action is the owner's pending decision, and swapping it is this one line. Known gaps of v2.6.1:
        # it checks only the first 100 commits of a pull request (no pagination), ignores co-authors, and does
        # not check the PR opener independently of the commits. The candidate is the iainmcgin fork, which
        # fixes these and takes the same inputs (it adds `require-opener-as-author`, default true); its README
        # calls it internal-use only, not an official successor:
        #   uses: iainmcgin/cla-github-action@0d27e5a16278d4adb6b0c4b92f08ad27b0a21dc8 # v3.2.0
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          remote-organization-name: benchhand
          remote-repository-name: cla-signers
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: main
          allowlist: "srobroek,bot*,dependabot*,renovate*,*[bot]*,sjorsr-release-bot*"
          lock-pullrequest-aftermerge: "false"
