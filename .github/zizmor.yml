rules:
  dangerous-triggers:
    ignore:
      # CLA Assistant has to run on pull_request_target and issue_comment:
      # it comments on pull requests from forks and sets their status. The
      # workflow checks out no code and runs nothing from the pull request.
      - cla.yml
  archived-uses:
    ignore:
      # contributor-assistant/github-action is archived (last push
      # 2026-03-23). The owner chose it, as platevault does; the full-SHA
      # pin means the archived code is what runs. See docs/tooling.md.
      - cla.yml
